  text.gclbl { fill:#ff6f5e; } text.xlbl { fill:#4fd39b; } text.ttl { fill:#8ea3ad; }
  .dim line { stroke:#ff6f5e; } .dim text { fill:#ff6f5e; }
  .faint line { stroke:#8ea3ad; } .faint text { fill:#8ea3ad; }
}
