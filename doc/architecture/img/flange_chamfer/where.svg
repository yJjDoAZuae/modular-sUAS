  .relief  { fill:rgba(69,194,214,.12); }
  .ring    { stroke:#4fd39b; }
  .rule, .axis { stroke:#5b6f79; }
  .ray     { stroke:#ff6f5e; }
  .edge    { stroke:#45c2d6; }
  .bar     { fill:rgba(179,154,224,.55); stroke:#b39ae0; }
  .barbad  { fill:rgba(255,111,94,.65); stroke:#ff6f5e; }
  .band    { fill:rgba(255,111,94,.12); }
