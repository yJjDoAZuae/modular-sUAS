.dim line  { stroke:#b8372a; stroke-width:1.1; }
.dim text  { font-family:monospace; font-size:10px; fill:#b8372a; font-weight:600; }
.faint line { stroke:#5d6f79; stroke-width:1; }
.faint text { fill:#5d6f79; font-weight:400; }
