<circle cx="260.000" cy="125.806" r="3.4" fill="#7a5ea8"/>
<text class="nclbl" x="260.00" y="115.81" text-anchor="middle">block corner = fillet center = relief center</text>
<text class="ttl" x="8" y="14">the cut only touches &#8212; angle exaggerated 7&#215;</text>
<text class="lbl" x="8" y="28">true angle 1.118&#176;. The wedge is real but lies outside the block, so the</text>
<text class="lbl" x="8" y="42">half-plane removes nothing and contact is a single point.</text>
<text class="lbl" x="8" y="537">OCCT emits a 0.000335 mm fold-back edge and a negative-area face there.</text></g></svg>
