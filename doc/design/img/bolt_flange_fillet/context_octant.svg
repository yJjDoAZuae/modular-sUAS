<text class="gclbl" x="375.82" y="183.96" text-anchor="end">the figures below</text>
<text class="nclbl" x="426.73" y="210.99" text-anchor="end">BoltFlangeFillet</text>
<text class="plbl" x="426.73" y="222.99" text-anchor="end">and the BffBlock it starts from</text>
<text class="xlbl" x="424.73" y="317.94" text-anchor="end">bolt hole</text>
<text class="plbl" x="526.55" y="78.85" text-anchor="end">flange wall</text>
<text class="ttl" x="8" y="14">the octant the fillet is built in &#8212; U=1.5 end_anchor 0mm</text>
<text class="lbl" x="8" y="28">the bulkhead is eight mirrored copies of this; every figure below uses this frame</text>
<text class="lbl" x="8" y="487">one solid crossing y = x: the mask keeps this side, its mirror supplies the rest</text></g></svg>
