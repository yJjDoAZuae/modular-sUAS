[project]
name = "modular-suas"
version = "0.1.0"
description = "Parametric generators for the MAUS modular sUAS airframe system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

dependencies = [
    "solidpython2>=2.1.2",
    # Held at 2.x deliberately. The sweep code was written against pandas 2.3.1, and
    # 3.0 changes string dtype and copy-on-write defaults in ways that affect CSV
    # reading. Revisit once Phase 1 has tests that would catch the difference.
    "pandas>=2.3.1,<3",
    "numpy>=2.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "pandas-stubs",
    # src/Fuselage/tools/test_fuse.ipynb is the interactive bench for poking at a
    # single part. It imports IPython.display.Image to show the preview PNGs, so
    # without these the notebook cannot be opened in this environment at all.
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[tool.uv]
# The sweeps shell out to the OpenSCAD binary and drive a live FreeCAD GUI, so this
# environment is machine-specific by nature. Keep the lock committed anyway: it is what
# makes a regenerated sweep comparable to the one before it.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # flag os.path where pathlib belongs
    "RET",      # return consistency
]
ignore = [
    "E501",     # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Archived .bak-adjacent scratch files are kept for history, not held to current style.
"src/Fuselage/archive/*" = ["ALL"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# solidpython2 ships no stubs and builds its API dynamically.
[[tool.mypy.overrides]]
module = "solid2.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/Fuselage/tools"]
addopts = "-ra"
